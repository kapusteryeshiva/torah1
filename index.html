מען דארף וויסן, אז די תפילה ווען א מענטש טאקע בעט ביים רבונו של עולם פאר בנין בית המקדש, איז מורא'דיג חשוב ביי דעם רבונו של עולם. עס איז זייער יתכן, אז דאס איז וואס איז מעכב די גאולה, אז מען בעט נישט מיט אן אמת ביי דעם. אבער יעדער איד, וואס וועט באמת בעטן פאר בנין בית המקדש, וועט ער טאקע קומען.

מיר זעהן טאקע, אז אלע תפילות וואס די אנשי כנסת הגדולה האבן מתקן געווען פאר ראש השנה און יום כיפור, איז אלעס פאר התגלות כבוד השכינה. עס איז נישט דא קיין שום תפילות וואס די אנשי כנסת הגדולה האבן מתקן געווען אויף עניני גשמיות. די איינציגסטע תפילות פון עניני גשמיות זענען די תפילות וואס די גאונים האבן מתקן געווען וזכרנו לחיים, וכתבנו, ובספר חיים. דער דברות מרדכי איז מאריך, די ראשונים פרעגן וויאזוי האבן די גאונים געקענט מתקן זיין די תפילות אין די ערשטע דריי ברכות און די לעצטע דריי ברכות. די גמרא זאגט דאך (ברכות לד ע"א), לעולם אל ישאל צרכיו בשלש ראשונות ובשלש אחרונות, אין הלכה אז מען טאר נישט בעטן קיין שום צרכי יחיד אין די ערשטע דריי און לעצטע דריי ברכות.

זאגן געוויסע פוסקים, אז דאס איז נאר א תפילה בדרך בקשה פאר א רבים. אנדערע ראשונים ענטפערן, אז די תפילה בעצם איז אויף רוחניות. זכרנו לחיים איז פארן חיים רוחניות, צו קענען לערנען און דאווענען און דינען דעם אויבערשטן. עס איז נישט אויף גשמיות בכלל, וממילא איז עס לצורך גבוהה.

באמת, ספרים ברענגין דעם זוהר הקדוש. אין תיקוני זוהר (תיקוני זוהר, תיקון ו, כב ע"א) שרייט ער געפערליך אויף די וואס בעטן פאר מזונות ראש השנה און יום כיפור, און ער זאגט אז זיי זענען ווי כלבים צועקים. אבער עס ווערט געברענגט פון דעם בעל שם הקדוש, אז היינט דארף מען יא בעטן פאר פרנסה, ווייל דאס איז א צורך גבוה. א מענטש וואס האט נישט קיין פרנסה, קען נישט דינען דעם אויבערשטן, ממילא דארף מען יא בעטן.

און ער ברענגט, אז רבי פנחס'ל קאריצער האט מקפיד געווען אויף דער וואס האט נישט געבעטן פאר פרנסה אין די ימים נוראים, ווייל דאס איז א צורך גבוה. ממילא, ווען א מענטש דאווענט "זכרנו לחיים", ער בעט פאר פרנסה וואס ער דארף האבן צו דינען דעם אויבערשטן. זכרנו לחיים, ווייל איך דארף האבן פרנסה צו קענען דינען דעם אויבערשטן, מיינט דאס "צורך גבוה", און דאס איז נישט קיין סתירה צו דעם זוהר. ער איז נישט שואל צרכיו, ער בעט ער זאל קענען דינען די אייבערשטער.

דער קדושת לוי זאגט א מורא'דיגן פשט (קדושת לוי, ראש השנה). באמת, דער רבונו של עולם, זיין גאנצע רצון, זיין גאנצע שמחה, איז משפיע צו זיין פאר אידישע קינדער. ער ברענגט א משל, אזוי ווי א מענטש וואס האט א קינד, א מורא'דיג באליבטע קינד, און ער וויל אים אלעס געבן און אים משפיע זיין כל טוב. אבער ס'מאכט זיך אז ער קען נישט משפיע זיין, איז עס א גרעסערער צער פאר די טאטע ווי פאר די קינד.

דער רבונו של עולם וויל אונז געבן כל טוב. דער פשט שטייט "משפט אלוקי יעקב" (תהילים פא ה), א משפט אויף דעם רבונו של עולם, פאר וואס ער קען אונז נישט געבן. דער רבונו של עולם וויל אונז געבן.

און דאס איז דער פשט פון "זכרנו לחיים" (מחזור ראש השנה), אז "מלך חפץ בחיים", ער וויל אונז געבן. און ווען מיר בעטן "וכתבנו לחיים למענך אלוקים חיים" (מחזור ראש השנה), פאר דיר, נישט פאר אונז, ווייל דו ווילסט אונז משפיע זיין.

מען קען אפשר מוסיף זיין אויף דעם, אז באמת מלכיות איז די עיקר עבודה פון ראש השנה, צו ממליך זיין דעם רבונו של עולם. מען בעט דאך "מלוך" (מוסף ראש השנה, מלכיות), אודאי די ערשטע זאך איז ממליך זיין דעם רבונו של עולם, אז ער זאל זיין מלך אויף זיך אליין. א מענטש דארף לעבן מיט די הכרה, אז אלעס קומט פונעם רבונו של עולם. עס איז נישטא קיין אנדערע כוחות אין די וועלט. אלעס וואס ער האט, קען נאר קומען פונעם רבונו של עולם. קיינער קען אים נישט העלפן, אחוץ דעם רבונו של עולם אליין. דאס איז די עיקר יסוד פון מלכיות.

ממילא, דער זוהר הקדוש רעדט פון כלבים צועקים, ווען א מענטש קומט און ער טוט אלע מיני סגולות, די סגולה פון בעטן, דאס איז כלבים צועקים. אבער ווען א מענטש קומט צו די הכרה, אז נאר דער רבונו של עולם קען אים העלפן, און זיין תפילה איז נאר צום רבונו של עולם, ווייל עס איז נישטא קיין אנדערע זאך, דאס איז נישט קיין כלבים צועקים. פארקערט, דאס איז מלכיות, דאס איז ממליך זיין דעם רבונו של עולם.

און דעריבער האבן די גאונים טאקע מתקן געווען אין די ערשטע דריי ברכות, ווייל דא, אין די ימים נוראים, דאס איז טאקע מלכיות. א מענטש קומט צו דער הכרה, נאר דער רבונו של עולם קען העלפן, דאס איז מלכיות, דאס איז צורך גבוהה, און דעריבער טאר מען בעטן אין די ערשטע דריי ברכות.

שטייט אין שולחן ערוך (שולחן ערוך, אורח חיים תקצ"ז א), אז אוכלים ושותים ושמחים. ס'זעט דאך אויס, אכלו משמנים ושתו ממתקים (נחמיה ח י), ולכאורה, וואס איז פשט אז אוכלים ושותים ושמחים? ס'איז דאך א יום הדין. מען זאגט דאך נישט קיין הלל, ווייל ספר חיים וספר מתים פתוחים לפניו (ראש השנה טז ב). איז וואס איז דער ענין פון שמחים?

אבער קען זיין, אז הא גופא, ווען א מענטש קומט צו דער הכרה, און ער לעבט מיט דעם, אז נאר דער רבונו של עולם העלפט, א תפילה מיט אמונה און בטחון אינעם רבונו של עולם, דאס ברענגט א געוואלדיגע שמחה צום מענטש. דער חובות הלבבות שרייבט (חובות הלבבות, שער הבטחון פרק א), אז עס ברענגט א מורא'דיגע רואיגקייט פאר א מענטש. א מענטש ווייסט, אז אלץ איז רבונו של עולם, אלץ איז רבונו של עולם, אלץ איז רבונו של עולם, עס איז גוט, און נאר דער רבונו של עולם קען העלפן. לעבט ער א רואיג לעבן.

ממילא, אוכלים ושותים ושמחים. מען פרייט זיך מיט דער הכרה, ווען מען קומט צו דער זאך, דאס ברענגט שמחה צום מענטש.

דער רבונו של עולם זאל טאקע העלפן, אז יעדער איינער זאל געבענטשט ווערן מיט א גוט געבענטשט יאר, מיט בני חיי ומזוני רויחא. מען זאל טאקע דינען דעם אויבערשטן בשמחה ובטיב לבב (דברים כח מז). מען זאל טאקע אויסבעטן ביאת גואל צדק, דער אויבערשטער זאל העלפן מ'זאל קומען ברחמים. אמן.`,wm=`האוהב ישראל מביא בליקוטים לראש השנה, שאף על פי שאדם צריך להתפלל בראש השנה על בנים חיי ומזוני, מכל מקום זה צריך להיות רק טפל. אבל עיקר התפילה שאדם צריך להתפלל בראש השנה היא על בניין בית המקדש ועל גלות השכינה.

וצריך לדעת, שהתפילה כשאדם באמת מבקש אצל רבונו של עולם על בניין בית המקדש, היא חשובה מאוד מאוד אצל רבונו של עולם. ויתכן מאוד שזה מה שמעכב את הגאולה, שאין מבקשים על כך באמת. אבל כל יהודי שיבקש באמת על בניין בית המקדש - היא תבוא.

והנה אנו רואים שכל התפילות שתיקנו אנשי כנסת הגדולה לראש השנה ויום הכיפורים - כולן הן על התגלות כבוד השכינה. אין שום תפילה שתיקנו אנשי כנסת הגדולה על ענייני גשמיות. התפילות היחידות על ענייני גשמיות הן התפילות שתיקנו הגאונים: "זכרנו לחיים" ו"כתבנו" ו"בספר חיים". הדברות מרדכי מאריך, הראשונים שואלים כיצד יכלו הגאונים לתקן תפילות אלו בשלוש ראשונות ובשלוש אחרונות. הרי הגמרא אומרת (ברכות לד ע"א) "לעולם אל ישאל אדם צרכיו בשלוש ראשונות ובשלוש אחרונות", ויש הלכה שאסור לבקש שום צרכי יחיד בשלוש ראשונות ואחרונות.

יש פוסקים אומרים שזה רק תפילה בדרך בקשה לרבים. ראשונים אחרים מתרצים שהתפילה בעצם היא על רוחניות. "זכרנו לחיים" היא על חיים רוחניים, לזכות ללמוד ולהתפלל ולעבוד את ה'. אין זה על גשמיות כלל, וממילא הוא לצורך גבוה.

באמת, ספרים מביאים את הזוהר הקדוש. בתיקוני זוהר (תיקון ו', כב ע"א) הוא צועק בחריפות גדולה על אלו המבקשים מזונות בראש השנה ויום הכיפורים, ואומר שהם כ"כלבים צועקים". אבל מובא מהבעל שם טוב הקדוש, שהיום צריך כן לבקש על פרנסה, כי זהו צורך גבוה. אדם שאין לו פרנסה אינו יכול לעבוד את ה', ולכן צריך לבקש.

ומובא שרבי פנחס'ל מקאריץ היה מקפיד על מי שלא ביקש פרנסה בימים הנוראים, כי זה צורך גבוה. וממילא כשאדם מתפלל "זכרנו לחיים" הוא מבקש פרנסה שצריך כדי לעבוד את ה'. "זכרנו לחיים" - כי אני צריך פרנסה כדי לעבוד את ה' - וזה נקרא "צורך גבוה", ואין זה סתירה לזוהר. הוא אינו שואל צרכיו, הוא מבקש שיוכל לעבוד את ה'.

הקדושת לוי אומר פירוש נפלא (קדושת לוי, ראש השנה). באמת, כל רצונו וכל שמחתו של רבונו של עולם הוא להשפיע לילדיו היהודים. הוא מביא משל לאדם שיש לו בן אהוב מאוד, והוא רוצה לתת לו הכל ולהשפיע לו כל טוב. אבל לפעמים אינו יכול להשפיע, וזה צער גדול יותר לאב מאשר לבן.

רבונו של עולם רוצה לתת לנו כל טוב. זה פירוש "משפט לאלהי יעקב" (תהלים פא ה) - משפט על רבונו של עולם, למה אינו יכול לתת לנו. רבונו של עולם רוצה לתת.

וזה פירוש "זכרנו לחיים, מלך חפץ בחיים" - הוא רוצה לתת לנו. וכשאנו מבקשים "וכתבנו לחיים למענך אלהים חיים" - למענך, לא למעננו, כי אתה רוצה להשפיע לנו.

ואפשר להוסיף על זה, שבאמת מלכיות היא עיקר העבודה של ראש השנה - להמליך את רבונו של עולם. הרי אנו מבקשים "מלוך" (מוסף ראש השנה, מלכיות). בוודאי הדבר הראשון הוא להמליך את רבונו של עולם על עצמו. אדם צריך לחיות בהכרה שהכל בא מרבונו של עולם. אין שום כוחות אחרים בעולם. כל מה שיש לו יכול לבוא רק מרבונו של עולם. אף אחד אינו יכול לעזור לו חוץ מרבונו של עולם לבדו. זהו עיקר יסוד המלכיות.

ממילא, כשהזוהר הקדוש מדבר על "כלבים צועקים", זה כשאדם בא ועושה כל מיני סגולות, הסגולה של תפילה - זה כלבים צועקים. אבל כשאדם בא להכרה שרק רבונו של עולם יכול לעזור לו, ותפילתו היא רק לרבונו של עולם כי אין שום דבר אחר - זה אינו כלבים צועקים. אדרבה, זה מלכיות, זה להמליך את רבונו של עולם.

ולכן תיקנו הגאונים דווקא בשלוש ראשונות, כי כאן בימים הנוראים זה ממש מלכיות. כשאדם בא להכרה שרק רבונו של עולם יכול לעזור - זה מלכיות, זה צורך גבוה, ולכן מותר לבקש בשלוש ראשונות.

כתוב בשולחן ערוך (אורח חיים תקצ"ז א) שאוכלים ושותים ושמחים. וזה נראה, "אכלו משמנים ושתו ממתקים" (נחמיה ח י). ולכאורה מה פירוש אוכלים ושותים ושמחים? הרי זה יום הדין. הרי אין אומרים הלל, כי ספר חיים וספר מתים פתוחים לפניו (ראש השנה טז ב). מה עניין השמחה?

אבל יתכן שזה גופא, כשאדם בא להכרה וחי עם זה שרק רבונו של עולם עוזר, תפילה עם אמונה וביטחון ברבונו של עולם - זה מביא שמחה גדולה לאדם. החובות הלבבות כותב (שער הביטחון פרק א) שזה מביא מנוחה נפלאה לאדם. אדם יודע שהכל רבונו של עולם, הכל רבונו של עולם, הכל טוב, ורק רבונו של עולם יכול לעזור - הוא חי חיים רגועים.

ממילא, אוכלים ושותים ושמחים. שמחים עם ההכרה הזו, כשמגיעים לדבר הזה - זה מביא שמחה לאדם.

יהי רצון שרבונו של עולם יעזור שכל אחד יתברך בשנה טובה ומבורכת, בבני חיי ומזוני רויחא, ונזכה לעבוד את ה' בשמחה ובטוב לבב (דברים כח מז), ונזכה לביאת גואל צדק, וה' יעזור שנבוא ברחמים. אמן.`,Sm=`The Ohev Yisrael brings in his Likutim on Rosh Hashanah: Although a person needs to daven on Rosh Hashanah for children, life, and sustenance (Bnei Chayei Mezonei), this should only be secondary. The primary tefillah a person should daven on Rosh Hashanah is for the rebuilding of the Beis HaMikdash and for the exile of the Shechinah.

One must know that when a person truly asks the Ribono Shel Olam for the building of the Beis HaMikdash, it is tremendously precious to the Ribono Shel Olam. It is very possible that this is what is holding back the Geulah - that we do not ask for it with truth. But every Jew who will truly ask for the building of the Beis HaMikdash - it will indeed come.

We see that all the tefillos that the Anshei Knesses HaGedolah instituted for Rosh Hashanah and Yom Kippur are all for the revelation of the glory of the Shechinah. There are no tefillos that the Anshei Knesses HaGedolah instituted for physical matters. The only tefillos for physical matters are those that the Geonim instituted: "Zochreinu LeChayim," "Kosveinu," "U'Besefer Chayim." The Divros Mordechai elaborates - the Rishonim ask how could the Geonim institute these tefillos in the first three and last three brachos? The Gemara says (Berachos 34a) "A person should never ask his needs in the first three or last three blessings," there is a halacha that one may not ask any personal needs in the first three and last three brachos.

Some poskim say this is only a tefillah in the form of a request for the many. Other Rishonim answer that the tefillah is essentially for spirituality. "Zochreinu LeChayim" is for spiritual life - to be able to learn and daven and serve Hashem. It is not at all about physicality, and therefore it is "Tzorech Gavoah" - a need of Heaven.

In truth, seforim bring the holy Zohar. In Tikunei Zohar (Tikun 6, 22a) he cries out fiercely against those who ask for sustenance on Rosh Hashanah and Yom Kippur, saying they are like "dogs barking." But it is brought from the holy Baal Shem Tov that today one should indeed ask for parnassah, because it is a Tzorech Gavoah. A person who has no parnassah cannot serve Hashem, therefore one must ask.

And it is brought that Reb Pinchas'le of Koretz was makpid on one who did not ask for parnassah in the Yamim Noraim, because it is a Tzorech Gavoah. Therefore, when a person davens "Zochreinu LeChayim," he asks for the parnassah he needs to serve Hashem. "Remember us for life" - because I need parnassah to be able to serve Hashem - this is called "Tzorech Gavoah," and this is not a contradiction to the Zohar. He is not asking for his own needs; he is asking to be able to serve Hashem.

The Kedushas Levi says a tremendous pshat (Kedushas Levi, Rosh Hashanah). In truth, the entire will, the entire joy of the Ribono Shel Olam is to bestow upon Jewish children. He brings a parable of a person who has a beloved child, and he wants to give him everything and bestow upon him all good. But sometimes he cannot bestow, and it is a greater pain for the father than for the child.

The Ribono Shel Olam wants to give us all good. This is the meaning of "Mishpat Elokei Yaakov" (Tehillim 81:5) - a judgment upon the Ribono Shel Olam, why can He not give us. The Ribono Shel Olam wants to give.

And this is the meaning of "Zochreinu LeChayim, Melech Chafetz BaChayim" - a King who desires life - He wants to give us. And when we ask "V'Chosveinu LeChayim Lema'ancha Elokim Chayim" - for Your sake, Living G-d - not for us, because You want to bestow upon us.

One can perhaps add to this that in truth Malchiyos is the main avodah of Rosh Hashanah - to crown the Ribono Shel Olam as King. We ask "Meloch" (Mussaf Rosh Hashanah, Malchiyos). Certainly the first thing is to crown the Ribono Shel Olam as King upon oneself. A person must live with the recognition that everything comes from the Ribono Shel Olam. There are no other powers in the world. Everything he has can only come from the Ribono Shel Olam. No one can help him except the Ribono Shel Olam Himself. This is the main foundation of Malchiyos.

Therefore, when the holy Zohar speaks of "dogs barking," it is when a person comes and does all kinds of segulos, the segulah of prayer - that is "dogs barking." But when a person comes to the recognition that only the Ribono Shel Olam can help him, and his tefillah is only to the Ribono Shel Olam because there is nothing else - that is not "dogs barking." On the contrary, that is Malchiyos, that is crowning the Ribono Shel Olam.

And therefore the Geonim instituted it specifically in the first three brachos, because here in the Yamim Noraim this is truly Malchiyos. A person comes to the recognition that only the Ribono Shel Olam can help - this is Malchiyos, this is Tzorech Gavoah, and therefore one may ask in the first three brachos.

It states in Shulchan Aruch (Orach Chaim 597:1) that we eat and drink and rejoice. It appears as "Eat rich foods and drink sweet drinks" (Nechemiah 8:10). And seemingly, what is the meaning of "eat and drink and rejoice"? It is Yom HaDin! We do not say Hallel, because "the Book of Life and the Book of Death are open before Him" (Rosh Hashanah 16b). What is the idea of rejoicing?

But it may be that this itself - when a person comes to the recognition and lives with it that only the Ribono Shel Olam helps, a tefillah with emunah and bitachon in the Ribono Shel Olam - this brings tremendous joy to a person. The Chovos Halevavos writes (Shaar HaBitachon Chapter 1) that it brings wonderful tranquility to a person. A person knows that everything is the Ribono Shel Olam, everything is the Ribono Shel Olam, everything is good, and only the Ribono Shel Olam can help. He lives a calm life.

Therefore, "eat and drink and rejoice." One rejoices with this recognition; when one comes to this matter, it brings joy to a person.
